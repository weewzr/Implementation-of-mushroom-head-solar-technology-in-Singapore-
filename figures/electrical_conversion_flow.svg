<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><style>text{font-family:Arial,sans-serif;fill:#17202a}.h{font-size:25px;font-weight:700}.t{font-size:11px}.s{font-size:9px}.b{fill:#e3f2e8;stroke:#287a4b;stroke-width:3}.l{fill:#f4f4f4;stroke:#666;stroke-width:2}.a{stroke:#555;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#555"/></marker></defs><text x="600" y="35" text-anchor="middle" class="h">Geometry-agnostic irradiance-to-net-electricity chain</text><text x="600" y="62" text-anchor="middle" class="s">First bounded Rust electrical kernel — provisional rigid-PV research basis</text>
<g transform="translate(40 120)"><rect width="170" height="90" rx="12" class="b"/><text x="85" y="34" text-anchor="middle" class="t">POA irradiance</text><text x="85" y="62" text-anchor="middle" class="s">G POA [W/m2]</text></g><line x1="215" y1="165" x2="255" y2="165" class="a"/>
<g transform="translate(260 120)"><rect width="170" height="90" rx="12" class="b"/><text x="85" y="32" text-anchor="middle" class="t">Module temperature</text><text x="85" y="58" text-anchor="middle" class="s">T module [degC]</text></g><line x1="435" y1="165" x2="475" y2="165" class="a"/>
<g transform="translate(480 120)"><rect width="190" height="90" rx="12" class="b"/><text x="95" y="31" text-anchor="middle" class="t">Temperature-adjusted</text><text x="95" y="52" text-anchor="middle" class="t">efficiency</text><text x="95" y="74" text-anchor="middle" class="s">eta [-]</text></g><line x1="675" y1="165" x2="715" y2="165" class="a"/>
<g transform="translate(720 120)"><rect width="150" height="90" rx="12" class="b"/><text x="75" y="34" text-anchor="middle" class="t">Ideal DC power</text><text x="75" y="62" text-anchor="middle" class="s">P DC ideal [W]</text></g><line x1="875" y1="165" x2="915" y2="165" class="a"/>
<g transform="translate(920 120)"><rect width="220" height="90" rx="12" class="l"/><text x="110" y="33" text-anchor="middle" class="t">Declared DC losses</text><text x="110" y="60" text-anchor="middle" class="s">mismatch + wiring [-]</text></g>
<line x1="1030" y1="215" x2="1030" y2="275" class="a"/>
<g transform="translate(920 285)"><rect width="220" height="90" rx="12" class="b"/><text x="110" y="33" text-anchor="middle" class="t">Inverter + AC losses</text><text x="110" y="60" text-anchor="middle" class="s">P AC [W]</text></g><line x1="915" y1="330" x2="825" y2="330" class="a"/>
<g transform="translate(620 285)"><rect width="200" height="90" rx="12" class="l"/><text x="100" y="33" text-anchor="middle" class="t">Auxiliary demand</text><text x="100" y="60" text-anchor="middle" class="s">P aux [W]</text></g><line x1="615" y1="330" x2="525" y2="330" class="a"/>
<g transform="translate(300 285)"><rect width="220" height="90" rx="12" class="b"/><text x="110" y="33" text-anchor="middle" class="t">Net electrical power</text><text x="110" y="60" text-anchor="middle" class="s">P net = P AC - P aux [W]</text></g><line x1="295" y1="330" x2="205" y2="330" class="a"/>
<g transform="translate(40 285)"><rect width="160" height="90" rx="12" class="b"/><text x="80" y="33" text-anchor="middle" class="t">Integration</text><text x="80" y="60" text-anchor="middle" class="s">sum(P net dt) [Wh]</text></g>
<text x="290" y="455" text-anchor="middle" class="t">IRRADIANCE RESULT</text><text x="290" y="480" text-anchor="middle" class="s">upstream frozen geometry model</text><text x="600" y="468" text-anchor="middle" class="t">→</text><text x="850" y="455" text-anchor="middle" class="t">ELECTRICAL CONVERSION RESULT</text><text x="850" y="480" text-anchor="middle" class="s">separate tested kernel; annual promotion not yet authorized</text></svg>