<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420"><style>text{font-family:Arial,sans-serif;fill:#17202a}.h{font-size:27px;font-weight:700}.t{font-size:15px}.s{font-size:12px}.b{fill:#e3f2e8;stroke:#287a4b;stroke-width:3}.l{fill:#f4f4f4;stroke:#666;stroke-width:2}.a{stroke:#555;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#555"/></marker></defs><text x="600" y="35" text-anchor="middle" class="h">Geometry-agnostic irradiance-to-net-electricity chain</text><text x="600" y="62" text-anchor="middle" class="s">First bounded Rust electrical kernel — provisional rigid-PV research basis</text><g transform="translate(25 120)"><rect width="120" height="90" rx="12" class="b"/><text x="60" y="35" text-anchor="middle" class="t">POA irradiance</text><text x="60" y="62" text-anchor="middle" class="s">W/m2</text></g><line x1="150" y1="165" x2="185" y2="165" class="a"/><g transform="translate(190 120)"><rect width="125" height="90" rx="12" class="b"/><text x="62" y="33" text-anchor="middle" class="t">Module</text><text x="62" y="53" text-anchor="middle" class="t">temperature</text><text x="62" y="74" text-anchor="middle" class="s">degC</text></g><line x1="320" y1="165" x2="355" y2="165" class="a"/><g transform="translate(360 120)"><rect width="135" height="90" rx="12" class="b"/><text x="67" y="33" text-anchor="middle" class="t">Temperature-</text><text x="67" y="53" text-anchor="middle" class="t">adjusted eta</text><text x="67" y="74" text-anchor="middle" class="s">fraction</text></g><line x1="500" y1="165" x2="535" y2="165" class="a"/><g transform="translate(540 120)"><rect width="105" height="90" rx="12" class="b"/><text x="52" y="42" text-anchor="middle" class="t">DC power</text><text x="52" y="68" text-anchor="middle" class="s">W</text></g><line x1="650" y1="165" x2="685" y2="165" class="a"/><g transform="translate(690 120)"><rect width="105" height="90" rx="12" class="l"/><text x="52" y="42" text-anchor="middle" class="t">DC losses</text><text x="52" y="68" text-anchor="middle" class="s">fraction</text></g><line x1="800" y1="165" x2="835" y2="165" class="a"/><g transform="translate(840 120)"><rect width="105" height="90" rx="12" class="b"/><text x="52" y="42" text-anchor="middle" class="t">Inverter</text><text x="52" y="68" text-anchor="middle" class="s">DC to AC</text></g><line x1="950" y1="165" x2="985" y2="165" class="a"/><g transform="translate(990 120)"><rect width="105" height="90" rx="12" class="b"/><text x="52" y="42" text-anchor="middle" class="t">AC power</text><text x="52" y="68" text-anchor="middle" class="s">W</text></g><line x1="1042" y1="215" x2="1042" y2="255" class="a"/><g transform="translate(915 265)"><rect width="255" height="90" rx="12" class="l"/><text x="127" y="35" text-anchor="middle" class="t">Auxiliary consumption</text><text x="127" y="62" text-anchor="middle" class="s">W; explicit net-import semantics</text></g><line x1="905" y1="310" x2="835" y2="310" class="a"/><g transform="translate(650 265)"><rect width="175" height="90" rx="12" class="b"/><text x="87" y="35" text-anchor="middle" class="t">Net electricity</text><text x="87" y="62" text-anchor="middle" class="s">W then Wh = sum(P dt)</text></g><text x="300" y="330" text-anchor="middle" class="t">IRRADIANCE RESULT</text><text x="300" y="355" text-anchor="middle" class="s">upstream frozen geometry model</text><text x="500" y="330" text-anchor="middle" class="t">→</text><text x="530" y="330" class="t">ELECTRICAL CONVERSION RESULT</text></svg>