<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><style>text{font-family:Arial,sans-serif;fill:#17202a}.h{font-size:25px;font-weight:700}.t{font-size:14px}.s{font-size:11px}.i{fill:#e8f1f8;stroke:#315b7d;stroke-width:2}.th{fill:#e3f2e8;stroke:#287a4b;stroke-width:3}.el{fill:#f4f4f4;stroke:#666;stroke-width:2}.a{stroke:#555;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#555"/></marker></defs><text x="600" y="34" text-anchor="middle" class="h">Frozen thermal + frozen electrical foundations with #191 coupling</text><g transform="translate(30 95)"><rect width="150" height="75" rx="10" class="i"/><text x="75" y="31" text-anchor="middle" class="t">POA irradiance</text><text x="75" y="54" text-anchor="middle" class="s">W/m2</text></g><g transform="translate(30 205)"><rect width="150" height="75" rx="10" class="i"/><text x="75" y="31" text-anchor="middle" class="t">Ambient temp.</text><text x="75" y="54" text-anchor="middle" class="s">degC</text></g><line x1="185" y1="133" x2="245" y2="180" class="a"/><line x1="185" y1="243" x2="245" y2="205" class="a"/><g transform="translate(250 145)"><rect width="170" height="105" rx="12" class="th"/><text x="85" y="33" text-anchor="middle" class="t">NMOT thermal</text><text x="85" y="56" text-anchor="middle" class="t">foundation</text><text x="85" y="82" text-anchor="middle" class="s">39 / 42 / 45 degC</text></g><line x1="425" y1="198" x2="480" y2="198" class="a"/><g transform="translate(485 155)"><rect width="150" height="85" rx="12" class="th"/><text x="75" y="34" text-anchor="middle" class="t">Module temp.</text><text x="75" y="59" text-anchor="middle" class="s">degC</text></g><line x1="640" y1="198" x2="695" y2="198" class="a"/><g transform="translate(700 120)"><rect width="190" height="155" rx="12" class="el"/><text x="95" y="32" text-anchor="middle" class="t">Frozen electrical kernel</text><text x="95" y="60" text-anchor="middle" class="s">temperature-adjusted eta</text><text x="95" y="82" text-anchor="middle" class="s">DC power + DC losses</text><text x="95" y="104" text-anchor="middle" class="s">inverter / AC losses</text><text x="95" y="126" text-anchor="middle" class="s">AC power [W]</text></g><line x1="895" y1="198" x2="950" y2="198" class="a"/><g transform="translate(955 120)"><rect width="210" height="75" rx="12" class="el"/><text x="105" y="31" text-anchor="middle" class="t">Auxiliary demand</text><text x="105" y="54" text-anchor="middle" class="s">explicit W</text></g><line x1="1060" y1="200" x2="1060" y2="265" class="a"/><g transform="translate(955 275)"><rect width="210" height="85" rx="12" class="th"/><text x="105" y="34" text-anchor="middle" class="t">Net power / energy</text><text x="105" y="59" text-anchor="middle" class="s">W; Wh = power x dt</text></g><text x="600" y="430" text-anchor="middle" class="t">#191 coupling orchestrates frozen components; annual geometry electrical results are not yet authorized.</text><text x="600" y="458" text-anchor="middle" class="s">Wind is not a baseline NMOT input. Faiman remains separately opt-in with explicit wind/coefficient provenance.</text></svg>