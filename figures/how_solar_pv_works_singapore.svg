<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs>
<rect width="1200" height="720" fill="white"/>
<text x="600" y="48" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700">How sunlight becomes useful solar electricity in Singapore</text>
<circle cx="135" cy="145" r="55" fill="#f2b134" stroke="#333" stroke-width="3"/>
<g stroke="#f2b134" stroke-width="7"><line x1="135" y1="65" x2="135" y2="30"/><line x1="55" y1="145" x2="20" y2="145"/><line x1="215" y1="145" x2="250" y2="145"/><line x1="78" y1="88" x2="52" y2="62"/><line x1="192" y1="88" x2="218" y2="62"/></g>
<text x="135" y="230" text-anchor="middle" font-family="sans-serif" font-size="22">Sun</text>
<path d="M310 135 C320 95 370 92 390 120 C420 90 475 108 476 145 C515 148 525 195 490 210 H325 C285 198 286 151 310 135 Z" fill="#d8dde3" stroke="#333" stroke-width="3"/>
<text x="405" y="238" text-anchor="middle" font-family="sans-serif" font-size="21">Clouds scatter and block</text>
<line x1="190" y1="165" x2="660" y2="390" stroke="#d9822b" stroke-width="7" marker-end="url(#arrow)"/>
<text x="410" y="305" font-family="sans-serif" font-size="21">direct beam</text>
<path d="M405 215 Q520 290 610 390" fill="none" stroke="#777" stroke-width="5" stroke-dasharray="12 10" marker-end="url(#arrow)"/>
<path d="M460 215 Q560 250 710 385" fill="none" stroke="#777" stroke-width="5" stroke-dasharray="12 10" marker-end="url(#arrow)"/>
<text x="545" y="260" font-family="sans-serif" font-size="21">diffuse sky light</text>
<polygon points="555,420 850,420 790,535 495,535" fill="#3d78a8" stroke="#222" stroke-width="4"/>
<g stroke="#b9d7ee" stroke-width="3"><line x1="575" y1="440" x2="830" y2="440"/><line x1="560" y1="470" x2="815" y2="470"/><line x1="545" y1="500" x2="800" y2="500"/><line x1="610" y1="422" x2="550" y2="533"/><line x1="680" y1="422" x2="620" y2="533"/><line x1="750" y1="422" x2="690" y2="533"/><line x1="820" y1="422" x2="760" y2="533"/></g>
<text x="675" y="575" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700">PV module: light creates DC electricity</text>
<line x1="850" y1="480" x2="930" y2="480" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="940" y="420" width="130" height="120" rx="12" fill="#f5f5f5" stroke="#333" stroke-width="3"/>
<text x="1005" y="466" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700">Inverter</text>
<text x="1005" y="498" text-anchor="middle" font-family="sans-serif" font-size="18">DC -> AC</text>
<line x1="1070" y1="480" x2="1150" y2="480" stroke="#333" stroke-width="5" marker-end="url(#arrow)"/>
<text x="1140" y="525" text-anchor="middle" font-family="sans-serif" font-size="19">building / grid</text>
<rect x="65" y="610" width="1070" height="75" rx="12" fill="#fafafa" stroke="#555" stroke-width="2"/>
<text x="600" y="640" text-anchor="middle" font-family="sans-serif" font-size="20">Singapore: near-equatorial daylight is fairly consistent, but clouds and rain make irradiance variable.</text>
<text x="600" y="670" text-anchor="middle" font-family="sans-serif" font-size="20">Limited land/roof area motivates this project to test whether 3-D geometry can use a footprint more effectively.</text>
</svg>