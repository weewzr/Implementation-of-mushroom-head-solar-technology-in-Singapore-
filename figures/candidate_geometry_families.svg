<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<style>text{font-family:Arial,sans-serif;fill: number 111}.t{font-size:28px;font-weight:bold}.s{font-size:20px}.l{stroke: number 111;stroke-width:4;fill:none}.f{stroke: number 111;stroke-width:3;fill: number f4f4f4}</style>
<text x="600" y="45" text-anchor="middle" class="t">Candidate geometry families under a common resource envelope</text>
<g transform="translate(40,90)"><text x="130" y="35" text-anchor="middle" class="t">Sphere / hemisphere</text><circle cx="130" cy="170" r="90" class="f"/><line x1="25" y1="260" x2="235" y2="260" class="l"/><text x="130" y="300" text-anchor="middle" class="s">symmetry benchmark</text></g>
<g transform="translate(330,90)"><text x="130" y="35" text-anchor="middle" class="t">Faceted canopy</text><polyline points="30,245 75,125 130,210 185,95 230,245" class="l"/><line x1="25" y1="260" x2="235" y2="260" class="l"/><text x="130" y="300" text-anchor="middle" class="s">discrete normals</text></g>
<g transform="translate(620,90)"><text x="130" y="35" text-anchor="middle" class="t">Flower / petals</text><ellipse cx="130" cy="160" rx="35" ry="95" class="f"/><ellipse cx="130" cy="160" rx="35" ry="95" class="f" transform="rotate(60 130 160)"/><ellipse cx="130" cy="160" rx="35" ry="95" class="f" transform="rotate(120 130 160)"/><circle cx="130" cy="160" r="22" class="f"/><text x="130" y="300" text-anchor="middle" class="s">sparse / bifacial access</text></g>
<g transform="translate(910,90)"><text x="130" y="35" text-anchor="middle" class="t">Folded surface</text><polyline points="25,235 75,115 130,235 185,115 235,235" class="l"/><line x1="25" y1="260" x2="235" y2="260" class="l"/><text x="130" y="300" text-anchor="middle" class="s">east-west orientation mix</text></g>
<g transform="translate(330,410)"><text x="130" y="35" text-anchor="middle" class="t">Free-form facets</text><polygon points="30,210 90,80 150,150 220,65 235,225 120,250" class="f"/><line x1="20" y1="265" x2="245" y2="265" class="l"/><text x="130" y="305" text-anchor="middle" class="s">optimisation search space</text></g>
<g transform="translate(620,410)"><text x="130" y="35" text-anchor="middle" class="t">Common accounting</text><rect x="20" y="70" width="220" height="185" class="f"/><text x="130" y="115" text-anchor="middle" class="s">same land footprint</text><text x="130" y="150" text-anchor="middle" class="s">same PV-area budget</text><text x="130" y="185" text-anchor="middle" class="s">same height envelope</text><text x="130" y="220" text-anchor="middle" class="s">same weather + losses</text></g>
</svg>