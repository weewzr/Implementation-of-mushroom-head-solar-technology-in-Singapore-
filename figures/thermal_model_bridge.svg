<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420"><style>text{font-family:Arial,sans-serif;fill:#17202a}.h{font-size:26px;font-weight:700}.t{font-size:16px}.s{font-size:12px}.in{fill:#e8f1f8;stroke:#315b7d;stroke-width:2}.m{fill:#e3f2e8;stroke:#287a4b;stroke-width:3}.e{fill:#f4f4f4;stroke:#666;stroke-width:2}.a{stroke:#555;stroke-width:3;marker-end:url(#x)}</style><defs><marker id="x" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#555"/></marker></defs><text x="600" y="38" text-anchor="middle" class="h">Phase-II thermal bridge to the frozen electrical kernel</text><g transform="translate(40 100)"><rect width="190" height="85" rx="12" class="in"/><text x="95" y="34" text-anchor="middle" class="t">POA irradiance</text><text x="95" y="60" text-anchor="middle" class="s">W/m2</text></g><g transform="translate(40 215)"><rect width="190" height="85" rx="12" class="in"/><text x="95" y="34" text-anchor="middle" class="t">Ambient air</text><text x="95" y="60" text-anchor="middle" class="s">degC</text></g><g transform="translate(40 330)"><rect width="190" height="65" rx="12" class="in"/><text x="95" y="28" text-anchor="middle" class="t">Wind / ventilation</text><text x="95" y="50" text-anchor="middle" class="s">future Faiman sensitivity</text></g><line x1="235" y1="143" x2="350" y2="200" class="a"/><line x1="235" y1="258" x2="350" y2="220" class="a"/><line x1="235" y1="360" x2="350" y2="245" class="a"/><g transform="translate(360 165)"><rect width="230" height="120" rx="14" class="m"/><text x="115" y="35" text-anchor="middle" class="h">Thermal model</text><text x="115" y="66" text-anchor="middle" class="t">NMOT baseline</text><text x="115" y="91" text-anchor="middle" class="s">39 / 42 / 45 degC</text></g><line x1="600" y1="225" x2="690" y2="225" class="a"/><g transform="translate(700 175)"><rect width="190" height="100" rx="14" class="m"/><text x="95" y="38" text-anchor="middle" class="t">Module temperature</text><text x="95" y="67" text-anchor="middle" class="s">degC</text></g><line x1="900" y1="225" x2="970" y2="225" class="a"/><g transform="translate(980 165)"><rect width="180" height="120" rx="14" class="e"/><text x="90" y="36" text-anchor="middle" class="t">Frozen electrical</text><text x="90" y="59" text-anchor="middle" class="t">kernel</text><text x="90" y="88" text-anchor="middle" class="s">DC -> AC -> net</text></g><text x="600" y="360" text-anchor="middle" class="s">Thermal model is replaceable; candidate-specific airflow coefficients are not assumed in the baseline.</text></svg>