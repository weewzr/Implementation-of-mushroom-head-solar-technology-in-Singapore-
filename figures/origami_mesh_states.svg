<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620"><style>text{font-family:Arial,sans-serif;fill:#17202a}.h{font-size:28px;font-weight:700}.t{font-size:19px}.s{font-size:16px}.f{fill:#bfe3f2;stroke:#176b87;stroke-width:3}.c{stroke:#d55e00;stroke-width:5;stroke-dasharray:9 6}.v{fill:#222}.b{fill:#f8fafb;stroke:#65727e;stroke-width:2}</style><text x="600" y="42" text-anchor="middle" class="h">What the computer sees when a sheet folds</text><g transform="translate(40 90)"><rect width="330" height="330" rx="12" class="b"/><text x="165" y="38" text-anchor="middle" class="h">lambda = 0</text><polygon points="45,150 165,90 285,150 165,210" class="f"/><line x1="165" y1="90" x2="165" y2="210" class="c"/><circle cx="45" cy="150" r="7" class="v"/><circle cx="165" cy="90" r="7" class="v"/><circle cx="285" cy="150" r="7" class="v"/><circle cx="165" cy="210" r="7" class="v"/><text x="165" y="285" text-anchor="middle" class="t">flat sheet</text></g><g transform="translate(435 90)"><rect width="330" height="330" rx="12" class="b"/><text x="165" y="38" text-anchor="middle" class="h">lambda = 0.5</text><polygon points="45,170 165,90 165,210" class="f"/><polygon points="165,90 270,125 165,210" class="f"/><line x1="165" y1="90" x2="165" y2="210" class="c"/><circle cx="45" cy="170" r="7" class="v"/><circle cx="165" cy="90" r="7" class="v"/><circle cx="270" cy="125" r="7" class="v"/><circle cx="165" cy="210" r="7" class="v"/><text x="165" y="285" text-anchor="middle" class="t">partly folded</text></g><g transform="translate(830 90)"><rect width="330" height="330" rx="12" class="b"/><text x="165" y="38" text-anchor="middle" class="h">lambda = 1</text><polygon points="45,185 165,90 165,210" class="f"/><polygon points="165,90 235,95 165,210" class="f"/><line x1="165" y1="90" x2="165" y2="210" class="c"/><circle cx="45" cy="185" r="7" class="v"/><circle cx="165" cy="90" r="7" class="v"/><circle cx="235" cy="95" r="7" class="v"/><circle cx="165" cy="210" r="7" class="v"/><text x="165" y="285" text-anchor="middle" class="t">deployed fixture</text></g><text x="600" y="475" text-anchor="middle" class="t">Dots are vertices. Little flat pieces are facets. The dashed line is the crease/hinge.</text><text x="600" y="515" text-anchor="middle" class="t">lambda means “how open the sheet is.” The computer checks several states, not just one folded-looking shape.</text><text x="600" y="565" text-anchor="middle" class="s">Engineering names: vertices V • facets F • crease edges C • deployment coordinate lambda in [0,1]</text></svg>