<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#fbfcfd"/><defs><marker id="gold" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#e3a008"/></marker><marker id="cyan" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#159bb5"/></marker></defs><text x="50" y="45" font-family="Arial" font-size="28" font-weight="700" fill="#17212b">Singapore solar geometry and direct-beam visibility</text><text x="50" y="75" font-family="Arial" font-size="16" fill="#5f6b76">Conceptual — not to scale. ENU coordinates; direct-beam ray test shown for one receiving facet.</text><line x1="160" y1="520" x2="420" y2="520" stroke="#314b6b" stroke-width="4"/><line x1="160" y1="520" x2="160" y2="260" stroke="#314b6b" stroke-width="4"/><line x1="160" y1="520" x2="80" y2="580" stroke="#314b6b" stroke-width="4"/><text x="430" y="526" font-family="Arial" font-size="18" fill="#314b6b">E</text><text x="148" y="245" font-family="Arial" font-size="18" fill="#314b6b">U</text><text x="55" y="595" font-family="Arial" font-size="18" fill="#314b6b">N</text><path d="M95 420 Q270 145 455 360" fill="none" stroke="#159bb5" stroke-width="5" stroke-dasharray="12 8"/><text x="260" y="165" font-family="Arial" font-size="17" fill="#159bb5">representative solar path</text><circle cx="390" cy="250" r="22" fill="#e3a008"/><g stroke="#e3a008" stroke-width="6" marker-end="url(#gold)"><line x1="375" y1="270" x2="700" y2="470"/><line x1="390" y1="240" x2="790" y2="430"/></g><text x="505" y="330" font-family="Arial" font-size="18" fill="#a66e00">solar unit vector s</text><path d="M650 500 Q770 360 900 500" fill="none" stroke="#14866d" stroke-width="18" stroke-linecap="round"/><line x1="770" y1="420" x2="770" y2="315" stroke="#14866d" stroke-width="5" marker-end="url(#cyan)"/><text x="785" y="330" font-family="Arial" font-size="18" fill="#14866d">facet normal n_i</text><circle cx="770" cy="420" r="8" fill="#17212b"/><text x="785" y="405" font-family="Arial" font-size="16" fill="#17212b">receiver centroid</text><path d="M825 390 L900 360 L930 405 L850 430 Z" fill="#f2ecfa" stroke="#7250a5" stroke-width="4"/><text x="895" y="345" text-anchor="middle" font-family="Arial" font-size="17" fill="#7250a5">potential blocker</text><line x1="770" y1="420" x2="390" y2="250" stroke="#e3a008" stroke-width="4" stroke-dasharray="10 7"/><text x="570" y="410" font-family="Arial" font-size="16" fill="#a66e00">centroid-to-Sun visibility ray</text><path d="M160 520 A95 95 0 0 1 220 435" fill="none" stroke="#d9672d" stroke-width="4"/><text x="210" y="485" font-family="Arial" font-size="17" fill="#d9672d">α</text><rect x="60" y="100" width="330" height="95" rx="12" fill="#fff7df" stroke="#e3a008" stroke-width="2"/><text x="80" y="130" font-family="Arial" font-size="17" font-weight="700" fill="#17212b">Direct-beam facet contribution</text><text x="80" y="160" font-family="Arial" font-size="20" fill="#17212b">A_i V_i max(n_i · s, 0)</text><text x="80" y="184" font-family="Arial" font-size="14" fill="#5f6b76">V_i = 1 if the Sun ray is unobstructed; 0 if blocked.</text><rect x="805" y="90" width="330" height="125" rx="12" fill="#e9f7fa" stroke="#159bb5" stroke-width="2"/><text x="825" y="120" font-family="Arial" font-size="17" font-weight="700" fill="#17212b">Coordinate convention</text><text x="825" y="150" font-family="Arial" font-size="15" fill="#17212b">x: East, y: North, z: Up</text><text x="825" y="176" font-family="Arial" font-size="15" fill="#17212b">α: solar altitude angle</text><text x="825" y="202" font-family="Arial" font-size="14" fill="#5f6b76">Solar path is illustrative, not weather data.</text></svg>