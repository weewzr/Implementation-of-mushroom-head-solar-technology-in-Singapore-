<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
<rect width="1200" height="520" fill="#fbfcfd"/>
<text x="50" y="45" font-family="Arial" font-size="28" font-weight="700" fill="#17212b">Equal-footprint concept comparison</text>
<text x="50" y="75" font-family="Arial" font-size="16" fill="#5f6b76">Conceptual — not to scale. Same constrained horizontal land footprint; PV surface area and performance are not assumed equal.</text>
<defs><marker id="sunarrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#e3a008"/></marker></defs>
<g stroke="#e3a008" stroke-width="5" marker-end="url(#sunarrow)"><line x1="95" y1="120" x2="145" y2="170"/><line x1="365" y1="120" x2="415" y2="170"/><line x1="650" y1="120" x2="700" y2="170"/><line x1="930" y1="120" x2="980" y2="170"/></g>
<!-- flat -->
<rect x="70" y="365" width="220" height="55" rx="8" fill="#e9eef5" stroke="#314b6b" stroke-width="3"/>
<line x1="85" y1="325" x2="275" y2="325" stroke="#314b6b" stroke-width="18"/>
<text x="180" y="285" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#314b6b">Fixed horizontal</text>
<text x="180" y="450" text-anchor="middle" font-family="Arial" font-size="15" fill="#5f6b76">Conventional baseline</text>
<!-- mushroom -->
<rect x="350" y="365" width="220" height="55" rx="8" fill="#e8f5f1" stroke="#14866d" stroke-width="3"/>
<path d="M365 315 Q460 205 555 315" fill="none" stroke="#14866d" stroke-width="18" stroke-linecap="round"/>
<line x1="460" y1="315" x2="460" y2="365" stroke="#59636e" stroke-width="8"/>
<text x="460" y="180" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#14866d">Paraboloidal mushroom</text>
<text x="460" y="450" text-anchor="middle" font-family="Arial" font-size="15" fill="#5f6b76">Founding candidate</text>
<!-- hemisphere -->
<rect x="630" y="365" width="220" height="55" rx="8" fill="#f2ecfa" stroke="#7250a5" stroke-width="3"/>
<path d="M645 325 A95 95 0 0 1 835 325" fill="none" stroke="#7250a5" stroke-width="18"/>
<text x="740" y="180" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#7250a5">Sphere / hemisphere</text>
<text x="740" y="450" text-anchor="middle" font-family="Arial" font-size="15" fill="#5f6b76">Competing 3-D geometry</text>
<!-- tracker -->
<rect x="910" y="365" width="220" height="55" rx="8" fill="#e9eef5" stroke="#314b6b" stroke-width="3"/>
<line x1="945" y1="315" x2="1095" y2="245" stroke="#314b6b" stroke-width="18" stroke-linecap="round"/>
<circle cx="1020" cy="280" r="14" fill="#d9672d"/>
<line x1="1020" y1="294" x2="1020" y2="365" stroke="#59636e" stroke-width="8"/>
<path d="M1065 335 A60 60 0 0 0 1090 285" fill="none" stroke="#d9672d" stroke-width="4" marker-end="url(#sunarrow)"/>
<text x="1020" y="180" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#314b6b">Tracking baseline</text>
<text x="1020" y="450" text-anchor="middle" font-family="Arial" font-size="15" fill="#5f6b76">Mechanical benchmark</text>
<text x="600" y="495" text-anchor="middle" font-family="Arial" font-size="15" fill="#17212b">Comparison rule: constrain A_land consistently; report A_PV, self-shading, sky view, mechanics and energy separately.</text>
</svg>