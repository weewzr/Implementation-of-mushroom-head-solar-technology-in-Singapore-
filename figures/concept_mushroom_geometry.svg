<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><marker id="sun" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#D99A00"/></marker></defs>
<rect width="1200" height="760" fill="#ffffff"/><text x="60" y="65" font-family="Arial" font-size="32" font-weight="700" fill="#0f172a">Paraboloidal “mushroom-head” PV geometry</text><text x="60" y="100" font-family="Arial" font-size="18" fill="#64748b">Conceptual — not to scale • founding candidate, not a validated optimum</text>
<line x1="120" y1="620" x2="1080" y2="620" stroke="#475569" stroke-width="4"/><rect x="360" y="620" width="480" height="28" rx="4" fill="#334155"/><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="20" fill="#334155">Constrained horizontal land footprint, A_land</text>
<path d="M310 520 Q600 135 890 520" fill="#0f766e" fill-opacity="0.16" stroke="#0f766e" stroke-width="8"/><path d="M310 520 Q600 210 890 520" fill="none" stroke="#14b8a6" stroke-width="3" stroke-dasharray="12 10"/><line x1="600" y1="520" x2="600" y2="170" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><text x="620" y="350" font-family="Arial" font-size="23" fill="#334155">h</text><line x1="600" y1="520" x2="890" y2="520" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><text x="745" y="505" font-family="Arial" font-size="23" fill="#334155">R</text>
<circle cx="760" cy="330" r="7" fill="#0f766e"/><line x1="760" y1="330" x2="840" y2="220" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"/><text x="850" y="218" font-family="Arial" font-size="21" fill="#0f766e">local normal n_i</text>
<line x1="1040" y1="130" x2="825" y2="280" stroke="#D99A00" stroke-width="7" marker-end="url(#sun)"/><line x1="1080" y1="190" x2="865" y2="340" stroke="#D99A00" stroke-width="5" marker-end="url(#sun)"/><circle cx="1070" cy="105" r="35" fill="#F5B700"/><text x="1020" y="275" font-family="Arial" font-size="21" fill="#B77900">solar vector s</text>
<line x1="600" y1="520" x2="600" y2="620" stroke="#64748b" stroke-width="10"/><circle cx="600" cy="590" r="18" fill="#64748b"/><path d="M560 590 A40 40 0 0 1 640 590" fill="none" stroke="#7c3aed" stroke-width="5" marker-end="url(#arrow)"/><text x="655" y="585" font-family="Arial" font-size="20" fill="#7c3aed">optional slow tracking axis</text>
<rect x="70" y="145" width="300" height="160" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="95" y="180" font-family="Arial" font-size="21" font-weight="700" fill="#0f172a">Geometry definitions</text><text x="95" y="218" font-family="Arial" font-size="19" fill="#334155">R — footprint radius (m)</text><text x="95" y="250" font-family="Arial" font-size="19" fill="#334155">h — canopy height (m)</text><text x="95" y="282" font-family="Arial" font-size="19" fill="#334155">A_PV — active curved PV area (m²)</text>
<text x="60" y="735" font-family="Arial" font-size="16" fill="#64748b">Semantic colour: solar = gold; mushroom candidate = teal; tracking/mechanics = violet; conventional structure = slate.</text></svg>