<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680"><style>text{font-family:Arial,sans-serif;fill:#17202a}.h{font-size:28px;font-weight:700}.t{font-size:15px}.b{fill:#f7f9fa;stroke:#506070;stroke-width:3}.p{fill:#bfe3f2;stroke:#176b87;stroke-width:3}.c{stroke:#d55e00;stroke-width:4;stroke-dasharray:8 6}.a{stroke:#555;stroke-width:4;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#555"/></marker></defs><text x="600" y="42" text-anchor="middle" class="h">Future deployable origami solar sheet — architecture only</text><g transform="translate(40 100)"><rect width="200" height="220" rx="12" class="b"/><rect x="35" y="55" width="130" height="95" class="p"/><text x="100" y="185" text-anchor="middle" class="t">flat-made sheet</text></g><line x1="250" y1="210" x2="310" y2="210" class="a"/><g transform="translate(320 100)"><rect width="200" height="220" rx="12" class="b"/><rect x="35" y="55" width="130" height="95" class="p"/><path d="M35 102 H165 M78 55 V150 M122 55 V150" class="c"/><text x="100" y="185" text-anchor="middle" class="t">crease pattern</text></g><line x1="530" y1="210" x2="590" y2="210" class="a"/><g transform="translate(600 100)"><rect width="200" height="220" rx="12" class="b"/><path d="M35 145 L75 70 L115 145 L155 70 L175 145" class="p"/><text x="100" y="185" text-anchor="middle" class="t">partly deployed</text><text x="100" y="208" text-anchor="middle" class="t">0 &lt; lambda &lt; 1</text></g><line x1="810" y1="210" x2="870" y2="210" class="a"/><g transform="translate(880 100)"><rect width="270" height="220" rx="12" class="b"/><path d="M25 145 Q135 30 245 145" class="p"/><text x="135" y="185" text-anchor="middle" class="t">deployed 3-D canopy</text><text x="135" y="208" text-anchor="middle" class="t">lambda = 1 - irradiance pipeline</text></g><line x1="1015" y1="330" x2="1015" y2="390" class="a"/><g transform="translate(880 405)"><rect width="270" height="150" rx="12" class="b"/><path d="M55 75 H215" class="p"/><text x="135" y="115" text-anchor="middle" class="t">storm-stowed state</text></g><text x="600" y="610" text-anchor="middle" class="t">Mesh model: vertices V + facets F + crease edges C + deployment coordinate lambda in [0,1].</text><text x="600" y="645" text-anchor="middle" class="t">Future checks: rigid facets, fold compatibility, collision, bend radius, PV strain, active-area preservation.</text></svg>