<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><style>text{font-family:Arial,sans-serif;fill:#17202a}.h{font-size:30px;font-weight:700}.t{font-size:20px}.s{font-size:16px}.panel{fill:#bfe3f2;stroke:#176b87;stroke-width:4}.land{fill:#dfe8d5;stroke:#5f7654;stroke-width:3}.sun{fill:#ffd166;stroke:#d99a00;stroke-width:4}.ray{stroke:#e69f00;stroke-width:5;marker-end:url(#a)}.thin{stroke:#555;stroke-width:3;fill:none}.dash{stroke:#888;stroke-width:3;stroke-dasharray:9 7;fill:none}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#e69f00"/></marker></defs><text x="600" y="45" text-anchor="middle" class="h">The whole idea in one picture</text><circle cx="90" cy="130" r="42" class="sun"/><text x="90" y="205" text-anchor="middle" class="t">Sun gives light</text><line x1="140" y1="130" x2="285" y2="130" class="ray"/><rect x="300" y="95" width="155" height="70" rx="8" class="panel"/><text x="378" y="205" text-anchor="middle" class="t">PV catches light</text><path d="M500 120 H620" class="ray"/><path d="M635 85 l35 35 -35 35 -35-35z" fill="#ffd166" stroke="#9b6b00" stroke-width="3"/><text x="635" y="205" text-anchor="middle" class="t">electricity</text><rect x="70" y="330" width="430" height="180" rx="12" class="land"/><text x="285" y="545" text-anchor="middle" class="t">same patch of Singapore land</text><rect x="155" y="385" width="260" height="45" class="panel"/><text x="285" y="315" text-anchor="middle" class="h">Flat</text><rect x="700" y="330" width="430" height="180" rx="12" class="land"/><path d="M760 420 Q915 285 1070 420" class="panel"/><line x1="915" y1="420" x2="915" y2="500" class="thin"/><text x="915" y="315" text-anchor="middle" class="h">Mushroom idea</text><text x="915" y="545" text-anchor="middle" class="t">more solar surface above similar land</text><text x="600" y="620" text-anchor="middle" class="h">But more panel does not automatically mean more useful light.</text><text x="600" y="660" text-anchor="middle" class="t">Some pieces face away, shade each other, or see less sky — so we test every shape fairly.</text></svg>