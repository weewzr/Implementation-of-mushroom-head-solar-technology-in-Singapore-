<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><style>text{font-family:Arial,sans-serif;fill:#17202a}.h{font-size:28px;font-weight:700}.t{font-size:18px}.s{font-size:15px}.xs{font-size:12px}.done{fill:#e3f2e8;stroke:#287a4b;stroke-width:3}.future{fill:#f4f4f4;stroke:#777;stroke-width:3;stroke-dasharray:8 6}.origin{fill:#fff0cf;stroke:#b87900;stroke-width:3}.arr{stroke:#555;stroke-width:4;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#555"/></marker></defs><text x="600" y="38" text-anchor="middle" class="h">From a Singapore land constraint to an evidence-tested solar design</text><text x="600" y="70" text-anchor="middle" class="s">Solid green = completed/validated project layer; dashed grey = next/future layer</text><g transform="translate(40 110)"><rect width="220" height="100" rx="14" class="done"/><text x="110" y="38" text-anchor="middle" class="h">Singapore</text><text x="110" y="68" text-anchor="middle" class="t">little spare land</text></g><line x1="270" y1="160" x2="330" y2="160" class="arr"/><g transform="translate(340 110)"><rect width="220" height="100" rx="14" class="done"/><text x="110" y="38" text-anchor="middle" class="h">Flat PV</text><text x="110" y="68" text-anchor="middle" class="t">reference baseline</text></g><line x1="570" y1="160" x2="630" y2="160" class="arr"/><g transform="translate(640 110)"><rect width="250" height="100" rx="14" class="origin"/><text x="125" y="38" text-anchor="middle" class="h">Mushroom idea</text><text x="125" y="68" text-anchor="middle" class="t">research origin, not winner</text></g><line x1="900" y1="160" x2="960" y2="160" class="arr"/><g transform="translate(970 110)"><rect width="190" height="100" rx="14" class="done"/><text x="95" y="35" text-anchor="middle" class="t">Can 3-D use</text><text x="95" y="62" text-anchor="middle" class="t">land better?</text></g><line x1="1065" y1="220" x2="1065" y2="270" class="arr"/><g transform="translate(750 280)"><rect width="410" height="115" rx="14" class="done"/><text x="205" y="32" text-anchor="middle" class="h">Fair geometry tests</text><text x="205" y="62" text-anchor="middle" class="t">flat / paraboloid / hemisphere</text><text x="205" y="88" text-anchor="middle" class="t">faceted canopy / folded surface</text></g><line x1="740" y1="338" x2="680" y2="338" class="arr"/><g transform="translate(340 280)"><rect width="330" height="115" rx="14" class="done"/><text x="165" y="32" text-anchor="middle" class="h">Sun + weather + model</text><text x="165" y="62" text-anchor="middle" class="t">SPA + NASA POWER</text><text x="165" y="88" text-anchor="middle" class="t">incidence / visibility / sky view</text></g><line x1="330" y1="338" x2="270" y2="338" class="arr"/><g transform="translate(40 280)"><rect width="220" height="115" rx="14" class="done"/><text x="110" y="32" text-anchor="middle" class="h">Annual comparison</text><text x="110" y="62" text-anchor="middle" class="t">equal land / equal PV</text><text x="110" y="84" text-anchor="middle" class="s">DEVELOPMENT</text><text x="110" y="103" text-anchor="middle" class="s">NOT SERIS</text></g><line x1="150" y1="405" x2="150" y2="465" class="arr"/><g transform="translate(40 475)"><rect width="280" height="105" rx="14" class="done"/><text x="140" y="34" text-anchor="middle" class="h">Deployable branch</text><text x="140" y="61" text-anchor="middle" class="s">single crease</text><text x="140" y="80" text-anchor="middle" class="s">+ accordion</text><text x="140" y="98" text-anchor="middle" class="xs">kinematics only</text></g><line x1="330" y1="528" x2="390" y2="528" class="arr"/><g transform="translate(400 475)"><rect width="220" height="105" rx="14" class="future"/><text x="110" y="34" text-anchor="middle" class="h">Electricity</text><text x="110" y="62" text-anchor="middle" class="s">NEXT: thermal</text><text x="110" y="84" text-anchor="middle" class="s">+ DC/AC</text></g><line x1="630" y1="528" x2="690" y2="528" class="arr"/><g transform="translate(700 475)"><rect width="200" height="105" rx="14" class="future"/><text x="100" y="34" text-anchor="middle" class="h">Cost + CO2</text><text x="100" y="64" text-anchor="middle" class="t">future assessment</text></g><line x1="910" y1="528" x2="970" y2="528" class="arr"/><g transform="translate(980 475)"><rect width="180" height="105" rx="14" class="future"/><text x="90" y="34" text-anchor="middle" class="h">Engineering</text><text x="90" y="64" text-anchor="middle" class="xs">recommendations</text></g><text x="600" y="655" text-anchor="middle" class="t">Packing gain x irradiance productivity gives the land-normalised solar outcome</text><text x="600" y="690" text-anchor="middle" class="s">Future electrical, structural, manufacturing, cost and carbon layers must be validated before final recommendations.</text></svg>