<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><style>text{font-family:Arial,sans-serif;fill:#17202a}.h{font-size:24px;font-weight:700}.t{font-size:16px}.box{fill:#f7f9fa;stroke:#506070;stroke-width:3}.blue{fill:#bfe3f2;stroke:#176b87;stroke-width:3}.green{fill:#dfe8d5;stroke:#5f7654;stroke-width:3}.arr{stroke:#555;stroke-width:4;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#555"/></marker></defs><text x="600" y="42" text-anchor="middle" class="h">Fair comparisons: two different questions</text><rect x="50" y="85" width="520" height="245" rx="15" class="box"/><text x="310" y="125" text-anchor="middle" class="h">Equal land = same-size playground</text><rect x="115" y="170" width="160" height="100" class="green"/><rect x="345" y="170" width="160" height="100" class="green"/><rect x="145" y="195" width="100" height="25" class="blue"/><path d="M365 240 Q425 160 485 240" class="blue"/><text x="310" y="305" text-anchor="middle" class="t">Same ground patch; solar material may differ.</text><rect x="630" y="85" width="520" height="245" rx="15" class="box"/><text x="890" y="118" text-anchor="middle" class="h">Equal PV = same amount</text><text x="890" y="145" text-anchor="middle" class="h">of solar material</text><rect x="690" y="215" width="160" height="35" class="blue"/><path d="M930 255 Q1010 170 1090 255" class="blue"/><text x="890" y="305" text-anchor="middle" class="t">Same active solar area; ground patch may differ.</text><rect x="70" y="390" width="310" height="210" rx="15" class="box"/><text x="225" y="430" text-anchor="middle" class="h">Packing ratio</text><text x="225" y="475" text-anchor="middle" class="t">How much solar material</text><text x="225" y="505" text-anchor="middle" class="t">fits above one ground patch?</text><rect x="445" y="390" width="310" height="210" rx="15" class="box"/><text x="600" y="430" text-anchor="middle" class="h">Packing efficiency</text><text x="600" y="475" text-anchor="middle" class="t">How well does each piece</text><text x="600" y="505" text-anchor="middle" class="t">catch light vs. flat?</text><rect x="820" y="390" width="310" height="210" rx="15" class="box"/><text x="975" y="430" text-anchor="middle" class="h">Land-energy multiplier</text><text x="975" y="475" text-anchor="middle" class="t">packing × how well</text><text x="975" y="505" text-anchor="middle" class="t">the material catches light</text><text x="600" y="665" text-anchor="middle" class="t">These are irradiance-comparison ideas here — not yet electrical, structural or economic performance.</text></svg>