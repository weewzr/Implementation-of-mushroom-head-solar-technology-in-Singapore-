<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650">
<rect width="1100" height="650" fill="#fbfcfd"/>
<defs>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#17212b"/></marker>
 <marker id="sunarrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#e69f00"/></marker>
</defs>
<text x="45" y="48" font-family="Arial" font-size="28" font-weight="700" fill="#17212b">Canonical ENU and solar-angle convention</text>
<text x="45" y="78" font-family="Arial" font-size="16" fill="#5f6b76">Right-handed East–North–Up frame; azimuth is clockwise from geographic North.</text>
<circle cx="490" cy="390" r="7" fill="#17212b"/>
<line x1="490" y1="390" x2="800" y2="390" stroke="#17212b" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="490" y1="390" x2="490" y2="115" stroke="#17212b" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="490" y1="390" x2="285" y2="545" stroke="#17212b" stroke-width="4" marker-end="url(#arrow)"/>
<text x="820" y="398" font-family="Arial" font-size="22" fill="#17212b">+x East</text>
<text x="505" y="125" font-family="Arial" font-size="22" fill="#17212b">+z Up</text>
<text x="155" y="570" font-family="Arial" font-size="22" fill="#17212b">+y North</text>
<line x1="490" y1="390" x2="730" y2="190" stroke="#e69f00" stroke-width="6" marker-end="url(#sunarrow)"/>
<circle cx="760" cy="165" r="25" fill="#f6c445" stroke="#e69f00" stroke-width="3"/>
<text x="780" y="165" font-family="Arial" font-size="20" fill="#8b5e00">Sun direction s</text>
<path d="M490 390 A150 150 0 0 1 615 306" fill="none" stroke="#0072b2" stroke-width="4"/>
<text x="600" y="365" font-family="Arial" font-size="20" fill="#0072b2">elevation α</text>
<path d="M330 510 A205 205 0 0 1 665 470" fill="none" stroke="#009e73" stroke-width="4" marker-end="url(#arrow)"/>
<text x="365" y="600" font-family="Arial" font-size="20" fill="#009e73">azimuth γs: clockwise from North</text>
<text x="55" y="150" font-family="Arial" font-size="18" fill="#17212b">Cardinal checks</text>
<text x="55" y="182" font-family="Arial" font-size="17" fill="#5f6b76">North horizon → (0, 1, 0)</text>
<text x="55" y="210" font-family="Arial" font-size="17" fill="#5f6b76">East horizon → (1, 0, 0)</text>
<text x="55" y="238" font-family="Arial" font-size="17" fill="#5f6b76">Zenith → (0, 0, 1)</text>
<text x="55" y="285" font-family="Arial" font-size="17" fill="#5f6b76">s = (cos α sin γs, cos α cos γs, sin α)</text>
</svg>