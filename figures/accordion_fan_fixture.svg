<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><style>text{font-family:Arial,sans-serif;fill:#17202a}.h{font-size:26px;font-weight:700}.t{font-size:17px}.s{font-size:14px}.p{fill:#bfe3f2;stroke:#176b87;stroke-width:3}.c{stroke:#d55e00;stroke-width:4;stroke-dasharray:8 6}.b{fill:#f7f9fa;stroke:#506070;stroke-width:2}</style><text x="600" y="36" text-anchor="middle" class="h">Controlled accordion/fan validation fixture</text><g transform="translate(35 75)"><rect width="330" height="300" rx="12" class="b"/><text x="165" y="35" text-anchor="middle" class="h">STOWED - lambda = 0</text><path d="M45 155 H285" class="p"/><path d="M105 120 V190 M165 120 V190 M225 120 V190" class="c"/><text x="165" y="245" text-anchor="middle" class="t">flat / compact sheet</text></g><g transform="translate(435 75)"><rect width="330" height="300" rx="12" class="b"/><text x="165" y="35" text-anchor="middle" class="h">PARTLY OPEN</text><text x="165" y="62" text-anchor="middle" class="t">0 &lt; lambda &lt; 1</text><path d="M45 170 L105 115 L165 170 L225 115 L285 170" class="p"/><path d="M105 115 L105 195 M165 170 L165 235 M225 115 L225 195" class="c"/></g><g transform="translate(835 75)"><rect width="330" height="300" rx="12" class="b"/><text x="165" y="35" text-anchor="middle" class="h">DEPLOYED - lambda = 1</text><path d="M35 190 L95 90 L165 190 L235 90 L295 190" class="p"/><path d="M95 90 L95 210 M165 190 L165 270 M235 90 L235 210" class="c"/></g><text x="600" y="420" text-anchor="middle" class="t">Beginner words: dots/corners = corners; panels = solar pieces; dashed fold lines = hinges; lambda = how open it is.</text><text x="600" y="452" text-anchor="middle" class="t">Engineering map: corners -> vertices V; panels -> facets F; fold lines -> crease set C; openness -> deployment coordinate lambda.</text><text x="600" y="486" text-anchor="middle" class="s">Compact transport, installation and storm stowage are engineering hypotheses only - structural and economic validation is still required.</text></svg>