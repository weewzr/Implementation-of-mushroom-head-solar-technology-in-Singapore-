name: Build technical report

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LaTeX and SVG dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-science inkscape

      - name: Compile SVG-enabled technical report
        working-directory: report
        run: |
          set -o pipefail
          latexmk -pdf -shell-escape -interaction=nonstopmode -halt-on-error project_technical_report.tex 2>&1 | tee project_technical_report.build.log
          test -s project_technical_report.pdf

      - name: Check unresolved references and serious LaTeX warnings
        working-directory: report
        run: |
          if grep -E "LaTeX Warning: (Reference|Citation).*undefined|There were undefined references|^! " project_technical_report.build.log; then
            echo "Unresolved references/citations or LaTeX errors detected."
            exit 1
          fi

      - name: Upload PDF and compile log
        uses: actions/upload-artifact@v4
        with:
          name: mushroom-head-technical-report
          path: |
            report/project_technical_report.pdf
            report/project_technical_report.build.log
          if-no-files-found: error
