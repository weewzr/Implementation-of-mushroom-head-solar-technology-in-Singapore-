name: Build technical report
on:
  push:
    paths:
      - 'report/**'
      - 'equations/**'
      - '.github/workflows/build-report.yml'
  workflow_dispatch:
jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-science latexmk poppler-utils inkscape
      - name: Generate reproducible publication figures\n        run: cargo run --quiet --bin fixed-comparison-publication\n      - name: Compile and retain log
        working-directory: report
        run: |
          set -o pipefail
          latexmk -pdf -shell-escape -interaction=nonstopmode -halt-on-error project_technical_report.tex 2>&1 | tee build-report.log
      - name: Check PDF metadata and extract text
        if: success()
        working-directory: report
        run: |
          pdfinfo project_technical_report.pdf
          pdftotext project_technical_report.pdf project_technical_report.txt
          test -s project_technical_report.txt
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mushroom-head-solar-technical-report-build-evidence
          path: |
            report/build-report.log
            report/project_technical_report.log
            report/project_technical_report.pdf
          if-no-files-found: warn
