name: Rust numerical kernel

on:
  push:
    paths:
      - 'rust/**'
      - '.github/workflows/rust-kernel.yml'
  workflow_dispatch:

jobs:
  test-and-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Show Rust toolchain
        run: rustc --version && cargo --version
      - name: Normalize Rust formatting
        run: cargo fmt
      - name: Verify formatting is stable
        run: cargo fmt --check
      - name: Compile and test
        run: cargo test --release
      - name: Run release benchmark
        run: |
          set -euo pipefail
          cargo run --release --bin raybench | tee rust_benchmark.txt
          test -s rust_benchmark.txt
      - name: Run mushroom convergence
        run: |
          set -euo pipefail
          cargo run --release --bin mushroom_convergence | tee rust_mushroom_convergence.csv
          test -s rust_mushroom_convergence.csv
          test "$(wc -l < rust_mushroom_convergence.csv)" -ge 5
      - name: Run orthogonal convergence
        run: |
          set -euo pipefail
          cargo run --release --bin orthogonal_convergence | tee rust_orthogonal_convergence.csv
          test -s rust_orthogonal_convergence.csv
          test "$(wc -l < rust_orthogonal_convergence.csv)" -ge 9
      - name: Generate analytical paraboloid response
        run: |
          set -euo pipefail
          cargo run --release --bin paraboloid_response | tee rust_paraboloid_response.csv
          test -s rust_paraboloid_response.csv
          # 1 header + 91 zenith angles * 4 exploratory aspect ratios.
          # This count is a category-5 output-grid integrity check, not physics.
          test "$(wc -l < rust_paraboloid_response.csv)" -eq 365
      - name: Upload numerical artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-numerical-results
          path: |
            rust/rust_benchmark.txt
            rust/rust_mushroom_convergence.csv
            rust/rust_orthogonal_convergence.csv
            rust/rust_paraboloid_response.csv
          if-no-files-found: error
