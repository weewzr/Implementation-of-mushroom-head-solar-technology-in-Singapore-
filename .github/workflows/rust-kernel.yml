name: Rust numerical kernel

on:
  push:
    paths:
      - 'rust/**'
      - '.github/workflows/rust-kernel.yml'
  workflow_dispatch:

jobs:
  test-and-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Show Rust toolchain
        run: rustc --version && cargo --version
      - name: Normalize Rust formatting
        run: cargo fmt
      - name: Verify formatting is stable
        run: cargo fmt --check
      - name: Compile and test
        run: cargo test --release
      - name: Run release benchmark
        run: cargo run --release --bin raybench | tee rust_benchmark.txt
      - name: Run mushroom convergence
        run: cargo run --release --bin mushroom_convergence | tee rust_mushroom_convergence.csv
      - name: Run orthogonal convergence
        run: cargo run --release --bin orthogonal_convergence | tee rust_orthogonal_convergence.csv
      - name: Upload numerical artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-numerical-results
          path: |
            rust/rust_benchmark.txt
            rust/rust_mushroom_convergence.csv
            rust/rust_orthogonal_convergence.csv
          if-no-files-found: error
