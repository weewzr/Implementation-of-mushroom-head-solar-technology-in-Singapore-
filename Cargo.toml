[package]
name = "mushroom-head-solar"
version = "0.1.0"
edition = "2021"
description = "Reproducible geometry and solar-analysis core for 3-D PV optimisation in land-constrained Singapore"
license = "UNLICENSED"

[lib]
name = "mushroom_solar"
path = "src/lib.rs"

[[bin]]
name = "mushroom-solar"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[[bin]]
name = "exploratory-results"
path = "src/bin/exploratory_results.rs"

[[bin]]
name = "discrete-verification"
path = "src/bin/discrete_verification.rs"

[[bin]]
name = "method-verification"
path = "src/bin/method_verification.rs"

[[bin]]
name = "development-weather-qc"
path = "src/bin/development_weather_qc.rs"

[[bin]]
name = "annual-development-baseline"
path = "src/bin/annual_development_baseline.rs"

[[bin]]
name = "mushroom-experiment-1"
path = "src/bin/mushroom_experiment_1.rs"
